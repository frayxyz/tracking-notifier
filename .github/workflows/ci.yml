name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificación de tipos
        run: npx tsc --noEmit
      - name: Pruebas (unitarias + integración con PostgreSQL real vía testcontainers)
        run: npm test
