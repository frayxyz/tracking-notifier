services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking
      POSTGRES_DB: tracking
    volumes:
      - datos_bd:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking"]
      interval: 5s
      timeout: 3s
      retries: 12

  webhook-mock:
    build: ./webhook-mock
    restart: unless-stopped
    environment:
      PORT: "9000"
      FAIL_PATHS: "/fail"
    ports:
      - "9000:9000"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tracking:tracking@db:5432/tracking
      PORT: "3000"
      LOG_LEVEL: info
      WORKER_INTERVAL_MS: "2000"
      WORKER_BATCH_SIZE: "5"
      HTTP_TIMEOUT_MS: "5000"
      MAX_ATTEMPTS: "5"
      BACKOFF_BASE_MS: "1000"
      WEBHOOK_HMAC_ENABLED: "true"
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - datos_grafana:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  datos_bd:
  datos_grafana:
